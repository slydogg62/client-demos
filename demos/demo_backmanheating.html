<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backmanheating • Instant Quote Estimator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">
  <header class="bg-cyan-950/60 border-b border-cyan-800/40 px-4 py-2.5 text-center text-xs text-cyan-300 font-medium">
    ⚡ Interactive Quote Demo tailored for <span class="font-bold underline text-white">Backmanheating</span>
  </header>
  <main class="max-w-xl mx-auto w-full p-4 sm:p-6 my-auto">
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
      <div class="text-center mb-6">
        <span class="inline-block px-3 py-1 bg-cyan-500/10 text-cyan-400 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">Instant Pricing Intake</span>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Backmanheating</h1>
        <p class="text-slate-400 text-xs mt-1">Get an upfront, transparent estimate in under 15 seconds.</p>
      </div>
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">1. Select Package</label>
        <div id="tierContainer" class="grid grid-cols-1 gap-2.5"></div>
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">2. Optional Add-Ons</label>
        <div id="addonContainer" class="space-y-2"></div>
      </div>
      <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-4 mb-6 flex items-center justify-between">
        <div>
          <div class="text-xs uppercase text-slate-400 font-bold tracking-wider">Estimated Total</div>
          <div class="text-xs text-slate-500">Taxes calculated at confirmation</div>
        </div>
        <div class="text-right">
          <span class="text-3xl font-extrabold text-cyan-400" id="totalDisplay">$0</span>
          <span class="text-xs text-slate-400 font-semibold block">CAD</span>
        </div>
      </div>
      <button onclick="requestBooking()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-cyan-500/20 text-xs uppercase tracking-wider">
        Book This Estimate Now
      </button>
      <p class="text-center text-xs text-slate-500 mt-3">Direct Contact: <span class="text-slate-300 font-medium">902-223-8511 | ryan@backmanheating.ca</span></p>
    </div>
  </main>
  <footer class="text-center py-4 text-xs text-slate-600">Built for Backmanheating</footer>
  <script>
    const tiers = [{"name": "Standard Inspection & Service", "price": 140, "desc": "Baseline labor and diagnostic"}, {"name": "Complete Package", "price": 190, "desc": "Full diagnostic with comprehensive service"}];
    const addons = [{"name": "Preventative Sealant / Addon", "price": 45}];
    let selectedTierIndex = 0;
    let selectedAddonIndices = new Set();

    function render() {
      const tc = document.getElementById('tierContainer');
      tc.innerHTML = '';
      tiers.forEach((t, i) => {
        const isSel = i === selectedTierIndex;
        const d = document.createElement('div');
        d.className = `cursor-pointer rounded-xl border p-3.5 transition flex items-center justify-between ${
          isSel ? 'bg-cyan-500/10 border-cyan-500 text-white' : 'bg-slate-800/40 border-slate-800 text-slate-300 hover:border-slate-700'
        }`;
        d.onclick = () => { selectedTierIndex = i; update(); };
        d.innerHTML = `<div><div class="font-bold text-sm ${isSel ? 'text-cyan-300' : 'text-slate-100'}">${t.name}</div><div class="text-xs text-slate-400">${t.desc || ''}</div></div><span class="font-extrabold text-base pl-3 text-white">$${t.price}</span>`;
        tc.appendChild(d);
      });

      const ac = document.getElementById('addonContainer');
      ac.innerHTML = '';
      addons.forEach((a, i) => {
        const isSel = selectedAddonIndices.has(i);
        const d = document.createElement('div');
        d.className = `cursor-pointer rounded-xl border p-2.5 flex items-center justify-between transition ${
          isSel ? 'bg-cyan-500/10 border-cyan-500/80 text-white' : 'bg-slate-800/30 border-slate-800 text-slate-300 hover:border-slate-700'
        }`;
        d.onclick = () => { if (selectedAddonIndices.has(i)) selectedAddonIndices.delete(i); else selectedAddonIndices.add(i); update(); };
        d.innerHTML = `<div class="flex items-center gap-2.5"><div class="w-4 h-4 rounded border flex items-center justify-center ${isSel ? 'bg-cyan-500 border-cyan-500 text-black font-bold' : 'border-slate-600 bg-slate-900'}">${isSel ? '✓' : ''}</div><span class="text-xs text-slate-200">${a.name}</span></div><span class="text-xs font-bold text-slate-300">+$${a.price}</span>`;
        ac.appendChild(d);
      });
    }

    function update() {
      render();
      let total = tiers[selectedTierIndex].price;
      selectedAddonIndices.forEach(i => { total += addons[i].price; });
      document.getElementById('totalDisplay').textContent = '$' + total;
    }

    function requestBooking() {
      const total = document.getElementById('totalDisplay').textContent;
      alert(`Estimate: ${total} CAD (${tiers[selectedTierIndex].name}).\n\nIn production, this automatically redirects to SMS or booking calendar.`);
    }
    update();
  </script>
</body>
</html>
